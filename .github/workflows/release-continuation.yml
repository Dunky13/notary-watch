name: Release continuation
on:
  workflow_run:
    workflows: [Distribution]
    types: [completed]
    branches: [main]
  schedule:
    - cron: '*/15 * * * *'
  workflow_dispatch:
permissions:
  contents: read
  actions: write
concurrency:
  group: release-continuation
  cancel-in-progress: false
jobs:
  continue:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Continue only the latest bound recoverable candidate, at most twelve attempts
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: scripts/ci/continue-release.sh
